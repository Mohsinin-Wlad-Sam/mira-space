# MIRA — the same static site behind nginx (put inside an http { } block or in /etc/nginx/conf.d/mira.conf).
server {
    listen 80;
    server_name _;
    root /srv/mira;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/octet-stream;
    gzip_min_length 1024;

    location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /data/sphx2/  { add_header Cache-Control "public, max-age=3600"; }
    location /data/        { add_header Cache-Control "public, max-age=600"; }
    location /live/        { add_header Cache-Control "public, max-age=600"; }
    location /explore/     { try_files $uri $uri/ /explore/index.html; }
    location /             { try_files $uri $uri/ /index.html; }
}
